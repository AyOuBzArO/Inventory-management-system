<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IMS - Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; }
        nav { background: white; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        nav img { height: 40px; }
        nav div { display: flex; align-items: center; gap: 16px; }
        nav span { color: #444; font-size: 14px; }
        .btn-logout { background: #f5f5f5; color: #333; border: 1.5px solid #e0e0e0; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .btn-logout:hover { background: #0a2e2e; color: white; border-color: #0a2e2e; }
        .container { max-width: 1100px; margin: 32px auto; padding: 0 20px; }
        h1 { font-size: 22px; color: #0a2e2e; margin-bottom: 4px; }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 28px; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 36px; }
        .stat-card { background: white; padding: 24px 28px; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-left: 4px solid #1a6b5a; }
        .stat-card.warning { border-left-color: #e53e3e; }
        .stat-card h3 { font-size: 34px; color: #0a2e2e; font-weight: 700; }
        .stat-card.warning h3 { color: #e53e3e; }
        .stat-card p { color: #888; font-size: 13px; margin-top: 4px; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .toolbar h2 { font-size: 18px; color: #0a2e2e; }
        .btn-add { background: #1a6b5a; color: white; border: none; padding: 11px 22px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; transition: background 0.2s; }
        .btn-add:hover { background: #0a2e2e; }
        .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow: hidden; transition: transform 0.2s; }
        .card:hover { transform: translateY(-4px); }
        .card img { width: 100%; height: 160px; object-fit: cover; background: #f0f0f0; }
        .card-no-img { width: 100%; height: 160px; background: #f0f4f3; display: flex; align-items: center; justify-content: center; font-size: 48px; }
        .card-body { padding: 16px; }
        .card-body h3 { font-size: 16px; color: #0a2e2e; margin-bottom: 4px; }
        .card-body p { font-size: 13px; color: #888; margin-bottom: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .price { font-size: 18px; font-weight: 700; color: #1a6b5a; }
        .stock { font-size: 12px; padding: 4px 10px; border-radius: 20px; background: #e8f5e9; color: #2e7d32; font-weight: 600; }
        .stock.low { background: #fff5f5; color: #e53e3e; }
        .card-actions { display: flex; gap: 8px; }
        .btn-edit { flex: 1; padding: 8px; background: #f0f4f3; color: #1a6b5a; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: background 0.2s; }
        .btn-edit:hover { background: #1a6b5a; color: white; }
        .btn-delete { flex: 1; padding: 8px; background: #fff5f5; color: #e53e3e; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: background 0.2s; }
        .btn-delete:hover { background: #e53e3e; color: white; }
        .empty { text-align: center; padding: 60px; color: #aaa; }
        .empty p { font-size: 16px; margin-top: 8px; }
    </style>
</head>
<body>
    <nav>
        <img src="logo.png" alt="IMS">
        <div>
            <span id="welcome"></span>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </nav>
    <div class="container">
        <h1>Dashboard</h1>
        <p class="subtitle">Overview of your inventory</p>
        <div class="stats">
            <div class="stat-card">
                <h3 id="total">0</h3>
                <p>Total Products</p>
            </div>
            <div class="stat-card warning">
                <h3 id="lowstock">0</h3>
                <p>Low Stock Items</p>
            </div>
            <div class="stat-card">
                <h3 id="value">$0</h3>
                <p>Inventory Value</p>
            </div>
        </div>
        <div class="toolbar">
            <h2>Products</h2>
            <button class="btn-add" onclick="window.location.href='add-product.html'">+ Add Product</button>
        </div>
        <div class="cards" id="cards"></div>
    </div>
    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';
        const headers = { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };

        async function loadStats() {
            const res = await fetch('http://127.0.0.1:8000/products/stats/summary', { headers });
            const data = await res.json();
            document.getElementById('total').textContent = data.total_products;
            document.getElementById('lowstock').textContent = data.low_stock_items;
            document.getElementById('value').textContent = '$' + data.total_inventory_value.toFixed(2);
        }

        async function loadProducts() {
            const res = await fetch('http://127.0.0.1:8000/products', { headers });
            const products = await res.json();
            const cards = document.getElementById('cards');
            cards.innerHTML = '';
            if (products.length === 0) {
                cards.innerHTML = '<div class="empty"><p>No products yet. Add your first product!</p></div>';
                return;
            }
            products.forEach(p => {
                const isLow = p.quantity < 5;
                const imgHTML = p.image
                    ? `<img src="http://127.0.0.1:8000${p.image}" alt="${p.name}">`
                    : `<div class="card-no-img">📦</div>`;
                cards.innerHTML += `
                    <div class="card">
                        ${imgHTML}
                        <div class="card-body">
                            <h3>${p.name}</h3>
                            <p>${p.description || 'No description'}</p>
                            <div class="card-meta">
                                <span class="price">$${p.price}</span>
                                <span class="stock ${isLow ? 'low' : ''}">
                                    ${isLow ? '⚠ ' : ''}${p.quantity} in stock
                                </span>
                            </div>
                            <div class="card-actions">
                                <button class="btn-edit" onclick="window.location.href='add-product.html?id=${p.id}'">Edit</button>
                                <button class="btn-delete" onclick="deleteProduct(${p.id})">Delete</button>
                            </div>
                        </div>
                    </div>`;
            });
        }

        async function deleteProduct(id) {
            if (!confirm('Delete this product?')) return;
            await fetch(`http://127.0.0.1:8000/products/${id}`, { method: 'DELETE', headers });
            loadProducts();
            loadStats();
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        }

        loadStats();
        loadProducts();
    </script>
</body>
</html>
