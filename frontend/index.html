<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IMS - Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; }
        nav { background: #4f46e5; padding: 16px 32px; color: white; display: flex; justify-content: space-between; align-items: center; }
        nav h1 { font-size: 20px; }
        nav button { background: white; color: #4f46e5; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .container { max-width: 1000px; margin: 32px auto; padding: 0 16px; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 32px; }
        .stat-card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); text-align: center; }
        .stat-card h3 { font-size: 32px; color: #4f46e5; }
        .stat-card p { color: #666; margin-top: 4px; }
        .stat-card.warning h3 { color: #e53e3e; }
        .actions { display: flex; justify-content: flex-end; margin-bottom: 16px; }
        .btn { background: #4f46e5; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
        table { width: 100%; background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); border-collapse: collapse; overflow: hidden; }
        th { background: #4f46e5; color: white; padding: 14px 16px; text-align: left; }
        td { padding: 14px 16px; border-bottom: 1px solid #f0f0f0; }
        tr:last-child td { border-bottom: none; }
        .low-stock { color: #e53e3e; font-weight: bold; }
        .btn-delete { background: #e53e3e; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        .btn-edit { background: #38a169; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; margin-right: 6px; }
    </style>
</head>
<body>
    <nav>
        <h1>IMS Dashboard</h1>
        <button onclick="logout()">Logout</button>
    </nav>

    <div class="container">
        <div class="stats">
            <div class="stat-card">
                <h3 id="total">0</h3>
                <p>Total Products</p>
            </div>
            <div class="stat-card warning">
                <h3 id="lowstock">0</h3>
                <p>Low Stock Items</p>
            </div>
            <div class="stat-card">
                <h3 id="value">0</h3>
                <p>Inventory Value ($)</p>
            </div>
        </div>

        <div class="actions">
            <button class="btn" onclick="window.location.href='add-product.html'">+ Add Product</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th><th>Name</th><th>Description</th><th>Quantity</th><th>Price</th><th>Actions</th>
                </tr>
            </thead>
            <tbody id="product-list"></tbody>
        </table>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        const headers = { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };

        async function loadStats() {
            const res = await fetch('http://127.0.0.1:8000/products/stats/summary', { headers });
            const data = await res.json();
            document.getElementById('total').textContent = data.total_products;
            document.getElementById('lowstock').textContent = data.low_stock_items;
            document.getElementById('value').textContent = data.total_inventory_value.toFixed(2);
        }

        async function loadProducts() {
            const res = await fetch('http://127.0.0.1:8000/products', { headers });
            const products = await res.json();
            const tbody = document.getElementById('product-list');
            tbody.innerHTML = '';
            products.forEach(p => {
                const isLow = p.quantity < 5;
                tbody.innerHTML += `
                    <tr>
                        <td>${p.id}</td>
                        <td>${p.name}</td>
                        <td>${p.description || '-'}</td>
                        <td class="${isLow ? 'low-stock' : ''}">${p.quantity}${isLow ? ' ⚠️' : ''}</td>
                        <td>$${p.price}</td>
                        <td>
                            <button class="btn-edit" onclick="editProduct(${p.id})">Edit</button>
                            <button class="btn-delete" onclick="deleteProduct(${p.id})">Delete</button>
                        </td>
                    </tr>`;
            });
        }

        async function deleteProduct(id) {
            if (!confirm('Delete this product?')) return;
            await fetch(`http://127.0.0.1:8000/products/${id}`, { method: 'DELETE', headers });
            loadProducts();
            loadStats();
        }

        function editProduct(id) {
            window.location.href = `add-product.html?id=${id}`;
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        }

        loadStats();
        loadProducts();
    </script>
</body>
</html>
