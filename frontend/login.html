<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IMS - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { display: flex; width: 900px; height: 520px; background: white; border-radius: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); overflow: hidden; }
        .left { background: #f0f7f5; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; border-right: 1px solid #e0e0e0; }
        .left h2 { color: #0a2e2e; font-size: 22px; text-align: center; font-weight: 600; }
        .left p { color: #4db897; margin-top: 8px; font-size: 14px; text-align: center; }
        .right { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 50px; }
        .right h2 { font-size: 26px; color: #0a2e2e; margin-bottom: 8px; }
        .right p { color: #888; font-size: 14px; margin-bottom: 32px; }
        label { font-size: 13px; color: #444; margin-bottom: 6px; display: block; font-weight: 500; }
        input { width: 100%; padding: 13px 16px; margin-bottom: 20px; border: 1.5px solid #e0e0e0; border-radius: 10px; font-size: 14px; outline: none; transition: border 0.2s; }
        input:focus { border-color: #1a6b5a; }
        button { width: 100%; padding: 14px; background: #1a6b5a; color: white; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        button:hover { background: #0a2e2e; }
        .error { color: #e53e3e; font-size: 13px; margin-bottom: 12px; display: none; background: #fff5f5; padding: 10px; border-radius: 8px; border: 1px solid #fed7d7; }
    </style>
</head>
<body>
    <div class="container">
        <div class="left">
            <img src="logo.png" alt="IMS Logo">
            <h2>Inventory Management System</h2>
            <p>Manage your stock with ease</p>
        </div>
        <div class="right">
            <h2>Welcome back</h2>
            <p>Sign in to your account to continue</p>
            <div class="error" id="error">Invalid username or password</div>
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter your username" />
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password" />
            <button onclick="login()">Sign In</button>
        </div>
    </div>
    <script>
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const formData = new URLSearchParams();
            formData.append('username', username);
            formData.append('password', password);
            const res = await fetch('http://127.0.0.1:8000/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            });
            if (res.ok) {
                const data = await res.json();
                localStorage.setItem('token', data.access_token);
                window.location.href = 'index.html';
            } else {
                document.getElementById('error').style.display = 'block';
            }
        }
    </script>
</body>
</html>
