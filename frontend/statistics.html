<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IMS — Statistics</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .stats-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-5); margin-bottom: var(--space-8); }
    .panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-2xl); box-shadow: var(--shadow-card); overflow: hidden; transition: all var(--transition-base); }
    .panel:hover { box-shadow: var(--shadow-card-hover); }
    .panel-header { padding: var(--space-5) var(--space-6); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: var(--space-3); background: linear-gradient(135deg, var(--bg-card), var(--gray-50)); }
    .dark .panel-header { background: linear-gradient(135deg, var(--bg-card), rgba(30,41,59,0.8)); }
    .panel-header .icon { color: var(--primary-500); width: 20px; height: 20px; }
    .panel-title { font-size: var(--text-base); font-weight: 600; color: var(--text-primary); }
    .panel-body { padding: var(--space-5) var(--space-6); }
    .panel-body.chart-body { padding: var(--space-4); }

    .rank-list { display: flex; flex-direction: column; }
    .rank-item { display: flex; align-items: center; padding: var(--space-3) 0; border-bottom: 1px solid var(--border-light); animation: fadeUp 0.3s ease-out both; }
    .rank-item:last-child { border-bottom: none; }
    .rank-number { width: 28px; font-size: var(--text-xs); font-weight: 600; color: var(--text-tertiary); }
    .rank-name { flex: 1; font-size: var(--text-sm); font-weight: 500; color: var(--text-primary); margin: 0 var(--space-3); }
    .rank-units { font-size: var(--text-xs); font-weight: 600; padding: var(--space-1) var(--space-3); border-radius: var(--radius-full); }
    .rank-units.green { background: var(--success-bg); color: var(--success); }
    .rank-units.red { background: var(--danger-bg); color: var(--danger); }

    .stock-list { display: flex; flex-direction: column; }
    .stock-item { display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) 0; border-bottom: 1px solid var(--border-light); animation: fadeUp 0.3s ease-out both; }
    .stock-item:last-child { border-bottom: none; }
    .stock-name { font-size: var(--text-sm); font-weight: 500; color: var(--text-primary); }
    .stock-badge { font-size: var(--text-xs); font-weight: 600; padding: var(--space-1) var(--space-3); border-radius: var(--radius-full); }
    .stock-badge.critical { background: var(--danger-bg); color: var(--danger); }
    .stock-badge.warning { background: var(--warning-bg); color: var(--warning); }

    .chart-wrapper { height: 280px; position: relative; }
    .chart-wrapper canvas { width: 100% !important; height: 100% !important; }
    .page-header { margin-bottom: var(--space-8); animation: fadeUp 0.5s ease-out; }
    .page-header-title { font-size: var(--text-3xl); font-weight: 700; color: var(--text-primary); letter-spacing: -0.02em; }
    .page-header-subtitle { font-size: var(--text-sm); color: var(--text-secondary); margin-top: var(--space-1); }
    .loading-text { color: var(--text-tertiary); font-size: var(--text-sm); padding: var(--space-4) 0; }
    .empty-text { text-align: center; color: var(--text-tertiary); font-size: var(--text-sm); padding: var(--space-8) 0; }

    @media (max-width: 768px) { .stats-two-col { grid-template-columns: 1fr; } .panel-body { padding: var(--space-4); } }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-brand">
        <img src="logo.png" alt="IMS" />
      </a>
      <div class="navbar-links">
        <a href="index.html" class="navbar-link">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 3l7 4-7 4-7-4 7-4z"/><path d="M19 7v8l-7 4v-8l7-4z"/><path d="M5 7v8l7 4v-8l-7-4z"/></svg>
          Products
        </a>
        <a href="add-product.html" class="navbar-link">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Product
        </a>
        <a href="statistics.html" class="navbar-link active">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
          Statistics
        </a>
      </div>
      <div class="navbar-right">
        <button class="theme-toggle" onclick="toggleTheme(); this.innerHTML = getThemeIcon()" title="Toggle theme">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/></svg>
        </button>
        <span class="navbar-user">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span id="welcome">Loading...</span>
        </span>
        <button class="btn btn-ghost btn-sm" onclick="logout()">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign out
        </button>
      </div>
    </div>
  </nav>

  <div id="toast-container" class="toast-container"></div>

  <div class="container page">
    <div class="page-header">
      <h1 class="page-header-title">Statistics</h1>
      <p class="page-header-subtitle" id="dateDisplay">Loading...</p>
    </div>

    <div class="stats-grid" id="revenueGrid">
      <div class="stat-card" data-accent="primary">
        <div class="stat-card-bg"></div>
        <div class="stat-card-shine"></div>
        <div class="stat-card-header">
          <div class="icon-box icon-box-primary">
            <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
          </div>
          <span class="stat-card-badge up" id="badgeDaily">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
            <span>+8.2%</span>
          </span>
        </div>
        <div class="stat-card-value" id="revDaily">—</div>
        <div class="stat-card-label">Daily Revenue</div>
        <div class="stat-card-footer">
          <span class="stat-card-trend up" id="trendDaily">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
            <span>Today</span>
          </span>
          <svg class="stat-card-sparkline" viewBox="0 0 100 24">
            <path d="M0,18 Q15,20 25,16 T50,10 T70,8 T85,12 T100,4" stroke="var(--primary-500)"/>
          </svg>
        </div>
        <div class="stat-card-progress"><div class="stat-card-progress-bar" style="width:65%" id="progressDaily"></div></div>
      </div>
      <div class="stat-card" data-accent="warning">
        <div class="stat-card-bg"></div>
        <div class="stat-card-shine"></div>
        <div class="stat-card-header">
          <div class="icon-box icon-box-warning">
            <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
          </div>
          <span class="stat-card-badge up" id="badgeWeekly">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
            <span>+5.7%</span>
          </span>
        </div>
        <div class="stat-card-value" id="revWeekly">—</div>
        <div class="stat-card-label">Weekly Revenue</div>
        <div class="stat-card-footer">
          <span class="stat-card-trend up" id="trendWeekly">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
            <span>Last 7 days</span>
          </span>
          <svg class="stat-card-sparkline" viewBox="0 0 100 24">
            <path d="M0,20 Q15,18 25,19 T50,12 T70,8 T85,10 T100,6" stroke="var(--warning)"/>
          </svg>
        </div>
        <div class="stat-card-progress"><div class="stat-card-progress-bar" style="width:72%" id="progressWeekly"></div></div>
      </div>
      <div class="stat-card" data-accent="danger">
        <div class="stat-card-bg"></div>
        <div class="stat-card-shine"></div>
        <div class="stat-card-header">
          <div class="icon-box icon-box-danger">
            <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
          </div>
          <span class="stat-card-badge down" id="badgeMonthly">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
            <span>-2.3%</span>
          </span>
        </div>
        <div class="stat-card-value" id="revMonthly">—</div>
        <div class="stat-card-label">Monthly Revenue</div>
        <div class="stat-card-footer">
          <span class="stat-card-trend down" id="trendMonthly">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
            <span>Last 30 days</span>
          </span>
          <svg class="stat-card-sparkline" viewBox="0 0 100 24">
            <path d="M0,4 Q15,6 25,5 T50,10 T70,14 T85,16 T100,18" stroke="var(--danger)"/>
          </svg>
        </div>
        <div class="stat-card-progress"><div class="stat-card-progress-bar" style="width:45%" id="progressMonthly"></div></div>
      </div>
    </div>

    <div class="stats-two-col">
      <div class="panel">
        <div class="panel-header">
          <svg class="icon" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          <span class="panel-title">Best Selling Products</span>
        </div>
        <div class="panel-body" id="bestSelling"><div class="loading-text">Loading...</div></div>
      </div>
      <div class="panel">
        <div class="panel-header">
          <svg class="icon" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
          <span class="panel-title">Worst Selling Products</span>
        </div>
        <div class="panel-body" id="worstSelling"><div class="loading-text">Loading...</div></div>
      </div>
    </div>

    <div class="stats-two-col">
      <div class="panel">
        <div class="panel-header">
          <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
          <span class="panel-title">Sales Over Time</span>
        </div>
        <div class="panel-body chart-body">
          <div class="chart-wrapper"><canvas id="salesChart"></canvas></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header">
          <svg class="icon" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <span class="panel-title">Low Stock Alerts</span>
        </div>
        <div class="panel-body" id="lowStock"><div class="loading-text">Loading...</div></div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    requireAuth();
    initTheme();
    initCardGlow();
    document.querySelector(".theme-toggle").innerHTML = getThemeIcon();
    document.getElementById("welcome").textContent = getWelcomeName();
    document.getElementById("dateDisplay").textContent = formatDate(new Date());

    const fmt = (n) => "$" + Number(n).toFixed(2);

    async function loadRevenue() {
      for (const period of ["daily", "weekly", "monthly"]) {
        try {
          const res = await fetch(API + "/sales/revenue?period=" + period, { headers: authHeaders() });
          if (!res.ok) throw new Error("Failed");
          const data = await res.json();
          document.getElementById("rev" + period.charAt(0).toUpperCase() + period.slice(1)).textContent = fmt(data.revenue);
        } catch {
          document.getElementById("rev" + period.charAt(0).toUpperCase() + period.slice(1)).textContent = "—";
        }
      }
    }

    async function loadBestSelling() {
      try {
        const res = await fetch(API + "/sales/best-selling", { headers: authHeaders() });
        if (!res.ok) throw new Error("Failed");
        const data = await res.json();
        const el = document.getElementById("bestSelling");
        if (!data || data.length === 0) { el.innerHTML = '<div class="empty-text">No sales data yet</div>'; return; }
        el.innerHTML = '<div class="rank-list">' + data.map((p, i) => `
          <div class="rank-item" style="animation-delay:${i * 0.05}s">
            <span class="rank-number">#${i + 1}</span>
            <span class="rank-name">${p.product_name}</span>
            <span class="rank-units green">${p.total_sold} sold</span>
          </div>`).join("") + '</div>';
      } catch { document.getElementById("bestSelling").innerHTML = '<div class="empty-text">Failed to load</div>'; }
    }

    async function loadWorstSelling() {
      try {
        const res = await fetch(API + "/sales/worst-selling", { headers: authHeaders() });
        if (!res.ok) throw new Error("Failed");
        const data = await res.json();
        const el = document.getElementById("worstSelling");
        if (!data || data.length === 0) { el.innerHTML = '<div class="empty-text">No products yet</div>'; return; }
        el.innerHTML = '<div class="rank-list">' + data.map((p, i) => `
          <div class="rank-item" style="animation-delay:${i * 0.05}s">
            <span class="rank-number">#${i + 1}</span>
            <span class="rank-name">${p.product_name}</span>
            <span class="rank-units red">${p.total_sold} sold</span>
          </div>`).join("") + '</div>';
      } catch { document.getElementById("worstSelling").innerHTML = '<div class="empty-text">Failed to load</div>'; }
    }

    async function loadLowStock() {
      try {
        const res = await fetch(API + "/sales/low-stock?threshold=10", { headers: authHeaders() });
        if (!res.ok) throw new Error("Failed");
        const data = await res.json();
        const el = document.getElementById("lowStock");
        if (!data || data.length === 0) { el.innerHTML = '<div class="empty-text">All products are well stocked</div>'; return; }
        el.innerHTML = '<div class="stock-list">' + data.map((p, i) => `
          <div class="stock-item" style="animation-delay:${i * 0.05}s">
            <span class="stock-name">${p.product_name}</span>
            <span class="stock-badge ${p.quantity <= 5 ? "critical" : "warning"}">${p.quantity} left</span>
          </div>`).join("") + '</div>';
      } catch { document.getElementById("lowStock").innerHTML = '<div class="empty-text">Failed to load</div>'; }
    }

    async function loadChart() {
      try {
        const res = await fetch(API + "/sales/over-time", { headers: authHeaders() });
        if (!res.ok) throw new Error("Failed");
        const data = await res.json();
        const canvas = document.getElementById("salesChart");
        const ctx = canvas.getContext("2d");
        if (!data || data.length === 0) { canvas.parentElement.innerHTML = '<div class="empty-text">No sales data yet</div>'; return; }

        var isDark = document.documentElement.classList.contains("dark");
        var gridColor = isDark ? "rgba(51,65,85,0.4)" : "rgba(226,232,240,0.6)";
        var textColor = isDark ? "#64748b" : "#94a3b8";
        var green = "#10b981", indigo = "#6366f1";

        new Chart(ctx, {
          type: "line",
          data: {
            labels: data.map((d) => d.date),
            datasets: [
              {
                label: "Revenue ($)",
                data: data.map((d) => d.revenue),
                borderColor: green,
                backgroundColor: function(ctx) {
                  var g = ctx.chart.ctx.createLinearGradient(0, 0, 0, 280);
                  g.addColorStop(0, isDark ? "rgba(16,185,129,0.15)" : "rgba(16,185,129,0.15)");
                  g.addColorStop(1, "rgba(16,185,129,0)");
                  return g;
                },
                borderWidth: 3,
                pointBackgroundColor: green,
                pointBorderColor: isDark ? "#1e293b" : "#fff",
                pointBorderWidth: 2.5,
                pointRadius: 0,
                pointHoverRadius: 7,
                pointHoverBorderWidth: 3,
                tension: 0.45,
                fill: true,
                yAxisID: "y",
              },
              {
                label: "Units Sold",
                data: data.map((d) => d.units_sold),
                borderColor: indigo,
                backgroundColor: function(ctx) {
                  var g = ctx.chart.ctx.createLinearGradient(0, 0, 0, 280);
                  g.addColorStop(0, isDark ? "rgba(99,102,241,0.1)" : "rgba(99,102,241,0.1)");
                  g.addColorStop(1, "rgba(99,102,241,0)");
                  return g;
                },
                borderWidth: 3,
                pointBackgroundColor: indigo,
                pointBorderColor: isDark ? "#1e293b" : "#fff",
                pointBorderWidth: 2.5,
                pointRadius: 0,
                pointHoverRadius: 7,
                pointHoverBorderWidth: 3,
                tension: 0.45,
                fill: true,
                yAxisID: "y1",
              },
            ],
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            animation: { duration: 1200, easing: "easeOutQuart" },
            interaction: { mode: "nearest", intersect: false, axis: "x" },
            plugins: {
              legend: {
                labels: {
                  color: textColor, font: { family: "Inter", size: 12 },
                  usePointStyle: true, pointStyle: "circle", padding: 16,
                },
              },
              tooltip: {
                backgroundColor: isDark ? "#1e293b" : "#fff",
                titleColor: isDark ? "#f1f5f9" : "#0f172a",
                bodyColor: isDark ? "#94a3b8" : "#64748b",
                borderColor: isDark ? "#334155" : "#e2e8f0",
                borderWidth: 1,
                padding: 12,
                cornerRadius: 12,
                boxPadding: 4,
                titleFont: { family: "Inter", size: 13, weight: "600" },
                bodyFont: { family: "Inter", size: 12 },
              },
            },
            scales: {
              x: {
                ticks: { color: textColor, font: { family: "Inter", size: 11 }, maxTicksLimit: 8 },
                grid: { color: gridColor, drawBorder: false },
              },
              y: {
                ticks: { color: green, font: { family: "Inter", size: 11 } },
                grid: { color: gridColor, drawBorder: false },
              },
              y1: {
                position: "right",
                ticks: { color: indigo, font: { family: "Inter", size: 11 } },
                grid: { display: false },
              },
            },
          },
        });
      } catch { document.getElementById("salesChart").parentElement.innerHTML = '<div class="empty-text">Failed to load chart</div>'; }
    }

    loadRevenue();
    loadBestSelling();
    loadWorstSelling();
    loadLowStock();
    loadChart();
  </script>
</body>
</html>
