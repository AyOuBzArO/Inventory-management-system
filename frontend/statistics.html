<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IMS - Statistics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; }

    /* NAV */
    nav {
      background: white;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    nav img { height: 40px; }
    nav div { display: flex; align-items: center; gap: 16px; }
    .nav-links { display: flex; gap: 8px; }
    .nav-link {
      color: #444;
      text-decoration: none;
      font-size: 14px;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .nav-link:hover { background: #f0f7f5; color: #1a6b5a; }
    .nav-link.active { background: #f0f7f5; color: #1a6b5a; font-weight: 600; }
    .btn-logout {
      background: #f5f5f5;
      color: #333;
      border: 1.5px solid #e0e0e0;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .btn-logout:hover { background: #0a2e2e; color: white; border-color: #0a2e2e; }

    /* CONTAINER */
    .container { max-width: 1100px; margin: 32px auto; padding: 0 20px; }

    h1 { font-size: 22px; color: #0a2e2e; margin-bottom: 4px; }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 28px; }

    /* REVENUE CARDS */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: white;
      padding: 24px 28px;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border-left: 4px solid #1a6b5a;
    }
    .stat-card.yellow { border-left-color: #d69e2e; }
    .stat-card.red { border-left-color: #e53e3e; }

    .stat-card h3 {
      font-size: 30px;
      color: #0a2e2e;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .stat-card.yellow h3 { color: #d69e2e; }
    .stat-card.red h3 { color: #e53e3e; }
    .stat-card p { color: #888; font-size: 13px; }
    .stat-card .label { color: #444; font-size: 13px; font-weight: 600; margin-bottom: 6px; }

    /* TWO COLUMN */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 28px;
    }

    /* PANELS */
    .panel {
      background: white;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      padding: 24px 28px;
    }

    .panel-title {
      font-size: 16px;
      font-weight: 700;
      color: #0a2e2e;
      margin-bottom: 20px;
    }

    /* PRODUCT ROWS */
    .product-row {
      display: flex;
      align-items: center;
      padding: 11px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .product-row:last-child { border-bottom: none; }

    .rank { font-size: 12px; color: #aaa; width: 22px; font-weight: 600; }
    .pname { flex: 1; font-size: 14px; color: #0a2e2e; font-weight: 500; margin-left: 8px; }
    .units {
      font-size: 13px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
    }
    .units.green { background: #e8f5e9; color: #2e7d32; }
    .units.red { background: #fff5f5; color: #e53e3e; }

    /* LOW STOCK */
    .stock-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .stock-row:last-child { border-bottom: none; }
    .stock-name { font-size: 14px; color: #0a2e2e; font-weight: 500; }
    .stock-badge {
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 600;
    }
    .stock-badge.critical { background: #fff5f5; color: #e53e3e; }
    .stock-badge.warning { background: #fffbeb; color: #d69e2e; }

    /* CHART */
    .chart-wrapper { height: 260px; margin-top: 16px; }

    /* EMPTY / LOADING */
    .empty { text-align: center; color: #aaa; font-size: 14px; padding: 24px 0; }
    .loading { color: #aaa; font-size: 14px; }
  </style>
</head>
<body>

  <nav>
    <img src="logo.png" alt="IMS">
    <div>
      <div class="nav-links">
        <a href="index.html" class="nav-link">📦 Products</a>
        <a href="add-product.html" class="nav-link">➕ Add Product</a>
        <a href="statistics.html" class="nav-link active">📊 Statistics</a>
      </div>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="container">
    <h1>Statistics</h1>
    <p class="subtitle" id="date">Loading...</p>

    <!-- REVENUE CARDS -->
    <div class="cards-grid">
      <div class="stat-card">
        <div class="label">Daily Revenue</div>
        <h3 id="rev-daily"><span class="loading">...</span></h3>
        <p>Today</p>
      </div>
      <div class="stat-card yellow">
        <div class="label">Weekly Revenue</div>
        <h3 id="rev-weekly"><span class="loading">...</span></h3>
        <p>Last 7 days</p>
      </div>
      <div class="stat-card red">
        <div class="label">Monthly Revenue</div>
        <h3 id="rev-monthly"><span class="loading">...</span></h3>
        <p>Last 30 days</p>
      </div>
    </div>

    <!-- BEST / WORST -->
    <div class="two-col">
      <div class="panel">
        <div class="panel-title">🏆 Best Selling Products</div>
        <div id="best-selling"><span class="loading">Loading...</span></div>
      </div>
      <div class="panel">
        <div class="panel-title">📉 Worst Selling Products</div>
        <div id="worst-selling"><span class="loading">Loading...</span></div>
      </div>
    </div>

    <!-- CHART + LOW STOCK -->
    <div class="two-col">
      <div class="panel">
        <div class="panel-title">📈 Sales Over Time</div>
        <div class="chart-wrapper">
          <canvas id="salesChart"></canvas>
        </div>
      </div>
      <div class="panel">
        <div class="panel-title">⚠️ Low Stock Alerts</div>
        <div id="low-stock"><span class="loading">Loading...</span></div>
      </div>
    </div>

  </div>

  <script>
    const API = 'http://127.0.0.1:8000';
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';

    const headers = {
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json'
    };

    document.getElementById('date').textContent =
      new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    function logout() {
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    }

    const fmt = (n) => '$' + Number(n).toFixed(2);

    async function loadRevenue() {
      for (const period of ['daily', 'weekly', 'monthly']) {
        try {
          const res = await fetch(`${API}/sales/revenue?period=${period}`, { headers });
          const data = await res.json();
          document.getElementById(`rev-${period}`).textContent = fmt(data.revenue);
        } catch {
          document.getElementById(`rev-${period}`).textContent = 'Error';
        }
      }
    }

    async function loadBestSelling() {
      try {
        const res = await fetch(`${API}/sales/best-selling`, { headers });
        const data = await res.json();
        const el = document.getElementById('best-selling');
        if (!data.length) { el.innerHTML = '<div class="empty">No sales yet</div>'; return; }
        el.innerHTML = data.map((p, i) => `
          <div class="product-row">
            <span class="rank">#${i + 1}</span>
            <span class="pname">${p.product_name}</span>
            <span class="units green">${p.total_sold} units</span>
          </div>`).join('');
      } catch {
        document.getElementById('best-selling').innerHTML = '<div class="empty">Failed to load</div>';
      }
    }

    async function loadWorstSelling() {
      try {
        const res = await fetch(`${API}/sales/worst-selling`, { headers });
        const data = await res.json();
        const el = document.getElementById('worst-selling');
        if (!data.length) { el.innerHTML = '<div class="empty">No products yet</div>'; return; }
        el.innerHTML = data.map((p, i) => `
          <div class="product-row">
            <span class="rank">#${i + 1}</span>
            <span class="pname">${p.product_name}</span>
            <span class="units red">${p.total_sold} units</span>
          </div>`).join('');
      } catch {
        document.getElementById('worst-selling').innerHTML = '<div class="empty">Failed to load</div>';
      }
    }

    async function loadLowStock() {
      try {
        const res = await fetch(`${API}/sales/low-stock?threshold=10`, { headers });
        const data = await res.json();
        const el = document.getElementById('low-stock');
        if (!data.length) {
          el.innerHTML = '<div class="empty">✅ All products well stocked</div>';
          return;
        }
        el.innerHTML = data.map(p => `
          <div class="stock-row">
            <span class="stock-name">${p.product_name}</span>
            <span class="stock-badge ${p.quantity <= 5 ? 'critical' : 'warning'}">${p.quantity} left</span>
          </div>`).join('');
      } catch {
        document.getElementById('low-stock').innerHTML = '<div class="empty">Failed to load</div>';
      }
    }

    async function loadChart() {
      try {
        const res = await fetch(`${API}/sales/over-time`, { headers });
        const data = await res.json();
        const ctx = document.getElementById('salesChart').getContext('2d');

        if (!data.length) {
          ctx.canvas.parentElement.innerHTML = '<div class="empty" style="padding-top:80px">No sales data yet</div>';
          return;
        }

        new Chart(ctx, {
          type: 'line',
          data: {
            labels: data.map(d => d.date),
            datasets: [
              {
                label: 'Revenue ($)',
                data: data.map(d => d.revenue),
                borderColor: '#1a6b5a',
                backgroundColor: 'rgba(26,107,90,0.08)',
                borderWidth: 2,
                pointBackgroundColor: '#1a6b5a',
                pointRadius: 4,
                tension: 0.4,
                fill: true,
                yAxisID: 'y'
              },
              {
                label: 'Units Sold',
                data: data.map(d => d.units_sold),
                borderColor: '#d69e2e',
                backgroundColor: 'rgba(214,158,46,0.06)',
                borderWidth: 2,
                pointBackgroundColor: '#d69e2e',
                pointRadius: 4,
                tension: 0.4,
                fill: true,
                yAxisID: 'y1'
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: {
                labels: { color: '#444', font: { family: 'Segoe UI', size: 12 } }
              }
            },
            scales: {
              x: {
                ticks: { color: '#888', font: { size: 11 } },
                grid: { color: '#f0f0f0' }
              },
              y: {
                ticks: { color: '#1a6b5a', font: { size: 11 } },
                grid: { color: '#f0f0f0' }
              },
              y1: {
                position: 'right',
                ticks: { color: '#d69e2e', font: { size: 11 } },
                grid: { display: false }
              }
            }
          }
        });
      } catch {
        document.getElementById('salesChart').parentElement.innerHTML =
          '<div class="empty" style="padding-top:80px">Failed to load chart</div>';
      }
    }

    loadRevenue();
    loadBestSelling();
    loadWorstSelling();
    loadLowStock();
    loadChart();
  </script>
</body>
</html>
