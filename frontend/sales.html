<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IMS — Sales</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-2xl); box-shadow: var(--shadow-card); overflow: hidden; transition: all var(--transition-base); margin-bottom: var(--space-6); }
    .panel:hover { box-shadow: var(--shadow-card-hover); }
    .panel-header { padding: var(--space-5) var(--space-6); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); background: linear-gradient(135deg, var(--bg-card), var(--gray-50)); }
    .dark .panel-header { background: linear-gradient(135deg, var(--bg-card), rgba(30,41,59,0.8)); }
    .panel-header-left { display: flex; align-items: center; gap: var(--space-3); }
    .panel-header .icon { color: var(--primary-500); width: 20px; height: 20px; }
    .panel-title { font-size: var(--text-base); font-weight: 600; color: var(--text-primary); }
    .panel-body { padding: var(--space-6); }
    .page-header { margin-bottom: var(--space-8); animation: fadeUp 0.5s ease-out; }
    .page-header-title { font-size: var(--text-3xl); font-weight: 700; color: var(--text-primary); letter-spacing: -0.02em; }
    .page-header-subtitle { font-size: var(--text-sm); color: var(--text-secondary); margin-top: var(--space-1); }

    .sales-layout { display: grid; grid-template-columns: 380px 1fr; gap: var(--space-6); align-items: start; }

    .form-group { margin-bottom: var(--space-5); }
    .form-label { display: block; font-size: var(--text-sm); font-weight: 600; color: var(--text-primary); margin-bottom: var(--space-2); }
    .form-select {
      width: 100%; padding: var(--space-3) var(--space-4);
      background: var(--bg); border: 1.5px solid var(--border);
      border-radius: var(--radius-md); font-size: var(--text-sm);
      color: var(--text-primary); outline: none;
      transition: all var(--transition-fast);
      appearance: none; -webkit-appearance: none;
    }
    .form-select:hover { border-color: var(--gray-400); }
    .form-select:focus { border-color: var(--border-focus); box-shadow: var(--shadow-focus); }
    .select-wrapper { position: relative; }
    .select-wrapper::after {
      content: ""; position: absolute; right: var(--space-4); top: 50%;
      transform: translateY(-50%); pointer-events: none;
      border: 5px solid transparent; border-top-color: var(--text-tertiary); margin-top: 3px;
    }

    .qty-control { display: flex; align-items: center; border: 1.5px solid var(--border); border-radius: var(--radius-md); overflow: hidden; background: var(--bg); }
    .qty-btn { width: 42px; height: 42px; border: none; background: var(--gray-50); color: var(--text-primary); font-size: 1.2rem; cursor: pointer; transition: all var(--transition-fast); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .dark .qty-btn { background: rgba(30,41,59,0.8); }
    .qty-btn:hover { background: var(--primary-50); color: var(--primary-600); }
    .qty-input { flex: 1; border: none; background: transparent; text-align: center; font-size: var(--text-base); font-weight: 600; color: var(--text-primary); outline: none; padding: var(--space-2); }

    .price-preview {
      background: linear-gradient(135deg, var(--primary-50), transparent);
      border: 1px solid rgba(16,185,129,0.2); border-radius: var(--radius-lg);
      padding: var(--space-4) var(--space-5); margin-bottom: var(--space-5);
      display: flex; align-items: center; justify-content: space-between;
    }
    .dark .price-preview { background: linear-gradient(135deg, rgba(16,185,129,0.08), transparent); }
    .price-preview-label { font-size: var(--text-sm); color: var(--text-secondary); font-weight: 500; }
    .price-preview-value { font-size: var(--text-2xl); font-weight: 700; color: var(--primary-600); letter-spacing: -0.02em; }

    .sale-btn {
      width: 100%; padding: var(--space-3) var(--space-6);
      background: var(--gradient-accent); color: white; border: none;
      border-radius: var(--radius-md); font-size: var(--text-base); font-weight: 600;
      cursor: pointer; transition: all var(--transition-base);
      box-shadow: 0 1px 2px rgba(0,0,0,0.1); position: relative;
      display: flex; align-items: center; justify-content: center; gap: var(--space-2);
    }
    .sale-btn:hover { box-shadow: 0 4px 12px rgba(5,150,105,0.3); transform: translateY(-1px); }
    .sale-btn:active { transform: translateY(0) scale(0.98); }
    .sale-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .sale-btn.loading { color: transparent; }
    .sale-btn.loading::after {
      content: ""; position: absolute; width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.3); border-top-color: white;
      border-radius: 50%; animation: spin 0.6s linear infinite;
    }

    .sales-table { width: 100%; border-collapse: collapse; }
    .sales-table th { padding: var(--space-3) var(--space-4); text-align: left; font-size: var(--text-xs); font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .sales-table td { padding: var(--space-3) var(--space-4); font-size: var(--text-sm); color: var(--text-primary); border-bottom: 1px solid var(--border-light); }
    .sales-table tr:last-child td { border-bottom: none; }
    .sales-table tr { animation: fadeUp 0.3s ease-out both; }
    .sales-table tbody tr:hover td { background: var(--gray-50); }
    .dark .sales-table tbody tr:hover td { background: rgba(30,41,59,0.5); }

    .empty-text { text-align: center; color: var(--text-tertiary); font-size: var(--text-sm); padding: var(--space-8) 0; }
    .loading-text { color: var(--text-tertiary); font-size: var(--text-sm); padding: var(--space-4) 0; }

    .badge-qty { background: var(--primary-50); color: var(--primary-600); font-size: var(--text-xs); font-weight: 600; padding: 2px var(--space-2); border-radius: var(--radius-full); }
    .dark .badge-qty { background: rgba(16,185,129,0.15); }
    .badge-revenue { color: var(--success); font-weight: 700; }
    .product-hint { font-size: var(--text-xs); color: var(--text-tertiary); margin-top: var(--space-1); min-height: 1.2em; }

    @media (max-width: 900px) { .sales-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-brand">
        <img src="logo.png" alt="IMS" />
      </a>
      <div class="navbar-links">
        <a href="index.html" class="navbar-link">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 3l7 4-7 4-7-4 7-4z"/><path d="M19 7v8l-7 4v-8l7-4z"/><path d="M5 7v8l7 4v-8l-7-4z"/></svg>
          <span data-i18n="nav.products">Products</span>
        </a>
        <a href="add-product.html" class="navbar-link">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span data-i18n="nav.addProduct">Add Product</span>
        </a>
        <a href="sales.html" class="navbar-link active">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span data-i18n="nav.sales">Sales</span>
        </a>
        <a href="statistics.html" class="navbar-link">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
          <span data-i18n="nav.statistics">Statistics</span>
        </a>
      </div>
      <div class="navbar-right">
        <button class="theme-toggle" id="langBtn" onclick="toggleLang()" title="Change language" style="font-size:var(--text-xs);font-weight:700;letter-spacing:0.05em">FR</button>
        <button class="theme-toggle" onclick="toggleTheme(); this.innerHTML = getThemeIcon()" title="Toggle theme">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/></svg>
        </button>
        <span class="navbar-user">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span id="welcome">Loading...</span>
        </span>
        <button class="btn btn-ghost btn-sm" onclick="logout()">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span data-i18n="nav.signOut">Sign out</span>
        </button>
      </div>
    </div>
  </nav>

  <div id="toast-container" class="toast-container"></div>

  <div class="container page">
    <div class="page-header">
      <h1 class="page-header-title" data-i18n="sales.pageTitle">Sales</h1>
      <p class="page-header-subtitle" id="dateDisplay">Loading...</p>
    </div>

    <div class="stats-grid">
      <div class="stat-card" data-accent="primary">
        <div class="stat-card-bg"></div>
        <div class="stat-card-shine"></div>
        <div class="stat-card-header">
          <div class="icon-box icon-box-primary">
            <svg class="icon" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          </div>
          <span class="stat-card-badge up"><svg class="icon" viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg><span data-i18n="sales.allTime">All time</span></span>
        </div>
        <div class="stat-card-value" id="statTotalSales">—</div>
        <div class="stat-card-label" data-i18n="sales.totalTransactions">Total Transactions</div>
        <div class="stat-card-footer">
          <span class="stat-card-trend up"><svg class="icon" viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg><span data-i18n="sales.allTime">All time</span></span>
          <svg class="stat-card-sparkline" viewBox="0 0 100 24"><path d="M0,20 Q15,18 25,16 T50,10 T70,7 T85,9 T100,4" stroke="var(--primary-500)"/></svg>
        </div>
        <div class="stat-card-progress"><div class="stat-card-progress-bar" id="progressTotalSales" style="width:0%"></div></div>
      </div>
      <div class="stat-card" data-accent="warning">
        <div class="stat-card-bg"></div>
        <div class="stat-card-shine"></div>
        <div class="stat-card-header">
          <div class="icon-box icon-box-warning">
            <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
          </div>
          <span class="stat-card-badge up"><svg class="icon" viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg><span data-i18n="sales.today">Today</span></span>
        </div>
        <div class="stat-card-value" id="statTodayRevenue">—</div>
        <div class="stat-card-label" data-i18n="sales.todayRevenue">Today's Revenue</div>
        <div class="stat-card-footer">
          <span class="stat-card-trend up"><svg class="icon" viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg><span data-i18n="sales.dailyTotal">Daily total</span></span>
          <svg class="stat-card-sparkline" viewBox="0 0 100 24"><path d="M0,18 Q15,20 25,16 T50,10 T70,8 T85,12 T100,4" stroke="var(--warning)"/></svg>
        </div>
        <div class="stat-card-progress"><div class="stat-card-progress-bar" id="progressTodayRevenue" style="width:0%"></div></div>
      </div>
      <div class="stat-card" data-accent="danger">
        <div class="stat-card-bg"></div>
        <div class="stat-card-shine"></div>
        <div class="stat-card-header">
          <div class="icon-box icon-box-danger">
            <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          </div>
          <span class="stat-card-badge up"><svg class="icon" viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg><span data-i18n="sales.allTime">All time</span></span>
        </div>
        <div class="stat-card-value" id="statTotalRevenue">—</div>
        <div class="stat-card-label" data-i18n="sales.totalRevenue">Total Revenue</div>
        <div class="stat-card-footer">
          <span class="stat-card-trend up"><svg class="icon" viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg><span data-i18n="sales.allTransactions">All transactions</span></span>
          <svg class="stat-card-sparkline" viewBox="0 0 100 24"><path d="M0,20 Q10,18 20,19 T40,12 T60,8 T80,10 T100,4" stroke="var(--primary-500)"/></svg>
        </div>
        <div class="stat-card-progress"><div class="stat-card-progress-bar" id="progressTotalRevenue" style="width:0%"></div></div>
      </div>
    </div>

    <div class="sales-layout">
      <div class="panel">
        <div class="panel-header">
          <div class="panel-header-left">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            <span class="panel-title" data-i18n="sales.recordSale">Record New Sale</span>
          </div>
        </div>
        <div class="panel-body">
          <div class="form-group">
            <label class="form-label" for="productSelect" data-i18n="sales.product">Product</label>
            <div class="select-wrapper">
              <select class="form-select" id="productSelect" onchange="updatePricePreview()">
                <option value="">Select a product...</option>
              </select>
            </div>
            <div class="product-hint" id="stockHint"></div>
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="sales.quantity">Quantity</label>
            <div class="qty-control">
              <button class="qty-btn" type="button" onclick="changeQty(-1)">−</button>
              <input class="qty-input" type="number" id="qtyInput" value="1" min="1" oninput="updatePricePreview()" />
              <button class="qty-btn" type="button" onclick="changeQty(1)">+</button>
            </div>
          </div>
          <div class="price-preview">
            <span class="price-preview-label" data-i18n="sales.estimatedTotal">Estimated Total</span>
            <span class="price-preview-value" id="pricePreview">$0.00</span>
          </div>
          <button class="sale-btn" id="saleBtn" onclick="recordSale()">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            <span data-i18n="sales.confirmSale">Confirm Sale</span>
          </button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <div class="panel-header-left">
            <svg class="icon" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            <span class="panel-title" data-i18n="sales.history">Sales History</span>
          </div>
          <span style="font-size:var(--text-xs);color:var(--text-tertiary);font-weight:500" id="salesCount"></span>
        </div>
        <div class="panel-body" style="padding:0;overflow-x:auto">
          <div id="salesHistoryContainer"><div class="loading-text" style="padding:var(--space-6)">Loading...</div></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    requireAuth();
    initTheme();
    initCardGlow();
    initLang();
    document.querySelector(".theme-toggle").innerHTML = getThemeIcon();
    document.getElementById("welcome").textContent = getWelcomeName();
    document.getElementById("dateDisplay").textContent = formatDate(new Date());

    let allProducts = [];

    async function loadProducts() {
      try {
        const res = await fetch(API + "/products", { headers: authHeaders() });
        if (!res.ok) throw new Error();
        allProducts = await res.json();
        const sel = document.getElementById("productSelect");
        const st = TRANSLATIONS[getLang()].sales;
        sel.innerHTML = '<option value="">' + st.selectProduct + '</option>';
        allProducts.forEach(p => {
          const opt = document.createElement("option");
          opt.value = p.id;
          opt.dataset.price = p.price;
          opt.dataset.stock = p.quantity;
          opt.textContent = p.name + " — $" + Number(p.price).toFixed(2) + " (" + p.quantity + " " + st.unitsInStock + ")";
          if (p.quantity === 0) opt.disabled = true;
          sel.appendChild(opt);
        });
      } catch {
        showToast(TRANSLATIONS[getLang()].sales.failedProducts, "error");
      }
    }

    function updatePricePreview() {
      const sel = document.getElementById("productSelect");
      const qty = parseInt(document.getElementById("qtyInput").value) || 0;
      const selected = sel.options[sel.selectedIndex];
      const hint = document.getElementById("stockHint");
      if (sel.value && selected) {
        const price = parseFloat(selected.dataset.price) || 0;
        const stock = parseInt(selected.dataset.stock) || 0;
        document.getElementById("pricePreview").textContent = "$" + (price * qty).toFixed(2);
        hint.textContent = stock + " " + TRANSLATIONS[getLang()].sales.unitsInStock;
        hint.style.color = stock < 5 ? "var(--danger)" : "var(--text-tertiary)";
      } else {
        document.getElementById("pricePreview").textContent = "$0.00";
        hint.textContent = "";
      }
    }

    function changeQty(delta) {
      const input = document.getElementById("qtyInput");
      input.value = Math.max(1, (parseInt(input.value) || 1) + delta);
      updatePricePreview();
    }

    async function recordSale() {
      const productId = document.getElementById("productSelect").value;
      const qty = parseInt(document.getElementById("qtyInput").value);
      const btn = document.getElementById("saleBtn");
      const st = TRANSLATIONS[getLang()].sales;
      if (!productId) { showToast(st.errorProduct, "error"); return; }
      if (!qty || qty < 1) { showToast(st.errorQty, "error"); return; }
      const sel = document.getElementById("productSelect");
      const stock = parseInt(sel.options[sel.selectedIndex].dataset.stock) || 0;
      if (qty > stock) { showToast(st.errorStock + " (" + stock + " " + st.available + ")", "error"); return; }

      btn.disabled = true;
      btn.classList.add("loading");
      try {
        const res = await fetch(API + "/sales/", {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify({ product_id: parseInt(productId), quantity: qty })
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || "Sale failed");
        }
        const data = await res.json();
        showToast(TRANSLATIONS[getLang()].sales.saleRecorded + " — $" + data.total_price.toFixed(2), "success");
        document.getElementById("productSelect").value = "";
        document.getElementById("qtyInput").value = 1;
        document.getElementById("pricePreview").textContent = "$0.00";
        document.getElementById("stockHint").textContent = "";
        loadSalesHistory();
        loadSalesStats();
        loadProducts();
      } catch(e) {
        showToast(e.message || "Failed to record sale", "error");
      } finally {
        btn.disabled = false;
        btn.classList.remove("loading");
      }
    }

    async function loadSalesHistory() {
      const container = document.getElementById("salesHistoryContainer");
      try {
        const res = await fetch(API + "/sales/", { headers: authHeaders() });
        if (!res.ok) throw new Error();
        const sales = await res.json();
        const st = TRANSLATIONS[getLang()].sales;
        document.getElementById("salesCount").textContent = sales.length + " " + (sales.length !== 1 ? st.transactions : st.transaction);
        if (sales.length === 0) {
          container.innerHTML = '<div class="empty-text">' + st.noSales + '</div>';
          return;
        }
        var t = TRANSLATIONS[getLang()].sales;
        container.innerHTML = `<table class="sales-table">
          <thead><tr>
            <th>${t.colDate}</th><th>${t.colProduct}</th><th>${t.colQty}</th><th>${t.colRevenue}</th>
          </tr></thead>
          <tbody>${sales.map((s, i) => `
            <tr style="animation-delay:${Math.min(i * 0.03, 0.5)}s">
              <td style="color:var(--text-secondary)">${formatSaleDate(s.sold_at)}</td>
              <td style="font-weight:500">${s.product_name}</td>
              <td><span class="badge-qty">&times;${s.quantity}</span></td>
              <td><span class="badge-revenue">$${s.total_price.toFixed(2)}</span></td>
            </tr>`).join("")}
          </tbody></table>`;
      } catch {
        container.innerHTML = '<div class="empty-text">' + TRANSLATIONS[getLang()].sales.failedSales + '</div>';
      }
    }

    async function loadSalesStats() {
      try {
        const [salesRes, todayRes] = await Promise.all([
          fetch(API + "/sales/", { headers: authHeaders() }),
          fetch(API + "/sales/revenue?period=daily", { headers: authHeaders() })
        ]);
        if (salesRes.ok) {
          const sales = await salesRes.json();
          const totalRevenue = sales.reduce((s, x) => s + x.total_price, 0);
          document.getElementById("statTotalSales").textContent = sales.length;
          document.getElementById("statTotalRevenue").textContent = "$" + totalRevenue.toFixed(2);
          document.getElementById("progressTotalSales").style.width = Math.min(sales.length * 2, 100) + "%";
          document.getElementById("progressTotalRevenue").style.width = Math.min((totalRevenue / 10000) * 100, 100) + "%";
        }
        if (todayRes.ok) {
          const today = await todayRes.json();
          document.getElementById("statTodayRevenue").textContent = "$" + Number(today.revenue).toFixed(2);
          document.getElementById("progressTodayRevenue").style.width = Math.min((today.revenue / 1000) * 100, 100) + "%";
        }
      } catch {}
    }

    function formatSaleDate(dateStr) {
      if (!dateStr) return "—";
      try {
        const locale = getLang() === "fr" ? "fr-FR" : "en-US";
        const d = new Date(dateStr);
        return d.toLocaleDateString(locale, { month: "short", day: "numeric" }) + " " +
               d.toLocaleTimeString(locale, { hour: "2-digit", minute: "2-digit" });
      } catch { return dateStr; }
    }

    window.onLangChange = function() { loadProducts(); loadSalesHistory(); };

    loadProducts();
    loadSalesHistory();
    loadSalesStats();
  </script>
</body>
</html>
