<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IMS — Add Product</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .form-page { max-width: 900px; margin: 0 auto; }
    .form-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-3xl); box-shadow: var(--shadow-card); overflow: hidden; }
    .form-card-header { padding: var(--space-6) var(--space-8); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: var(--space-4); }
    .form-card-header-icon { width: 44px; height: 44px; border-radius: var(--radius-lg); background: var(--primary-50); color: var(--primary-600); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .dark .form-card-header-icon { background: rgba(16,185,129,0.15); }
    .form-card-header h2 { font-size: var(--text-xl); font-weight: 700; color: var(--text-primary); letter-spacing: -0.02em; }
    .form-card-header p { font-size: var(--text-sm); color: var(--text-secondary); margin-top: var(--space-1); }
    .form-card-body { padding: var(--space-8); }
    .form-layout { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-8); align-items: start; }
    .form-section { margin-bottom: var(--space-6); }
    .form-section:last-child { margin-bottom: 0; }
    .form-section-title { font-size: var(--text-xs); font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: var(--space-4); padding-bottom: var(--space-2); border-bottom: 1px solid var(--border-light); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }

    .upload-zone {
      position: relative; border: 2px dashed var(--border); border-radius: var(--radius-xl);
      padding: var(--space-8); text-align: center; cursor: pointer;
      transition: all var(--transition-base); background: var(--gray-50);
    }
    .dark .upload-zone { background: rgba(30,41,59,0.5); }
    .upload-zone:hover { border-color: var(--primary-400); background: var(--primary-50); }
    .dark .upload-zone:hover { background: rgba(16,185,129,0.05); }
    .upload-zone.dragover { border-color: var(--primary-500); background: var(--primary-50); transform: scale(1.01); }
    .upload-zone .icon { width: 40px; height: 40px; color: var(--primary-400); margin-bottom: var(--space-3); }
    .upload-zone-text { font-size: var(--text-sm); font-weight: 600; color: var(--text-primary); margin-bottom: var(--space-1); }
    .upload-zone-hint { font-size: var(--text-xs); color: var(--text-tertiary); }

    .upload-preview { display: none; position: relative; border-radius: var(--radius-lg); overflow: hidden; }
    .upload-preview img { width: 100%; height: 240px; object-fit: cover; border-radius: var(--radius-lg); }
    .upload-preview-remove {
      position: absolute; top: var(--space-2); right: var(--space-2);
      width: 32px; height: 32px; border-radius: var(--radius-full);
      background: rgba(0,0,0,0.6); color: white; border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all var(--transition-fast); backdrop-filter: blur(4px);
    }
    .upload-preview-remove:hover { background: rgba(239,68,68,0.8); transform: scale(1.1); }

    .live-preview { position: sticky; top: calc(64px + var(--space-6)); }
    .preview-card { background: var(--bg-glass); backdrop-filter: var(--backdrop); border: 1px solid var(--border); border-radius: var(--radius-2xl); overflow: hidden; box-shadow: var(--shadow-card); transition: all var(--transition-base); }
    .preview-card:hover { box-shadow: var(--shadow-card-hover), 0 0 30px rgba(16,185,129,0.05); }
    .preview-card-image { width: 100%; height: 200px; background: linear-gradient(135deg, var(--primary-50), var(--gray-100)); display: flex; align-items: center; justify-content: center; color: var(--primary-300); transition: all var(--transition-base); position: relative; overflow: hidden; }
    .dark .preview-card-image { background: linear-gradient(135deg, rgba(16,185,129,0.1), var(--gray-800)); }
    .preview-card-image::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 30% 40%, rgba(16,185,129,0.08), transparent 60%); pointer-events: none; }
    .preview-card-image img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .preview-card-image:hover img { transform: scale(1.05); }
    .preview-card-image .icon { transition: all var(--transition-base); filter: drop-shadow(0 0 8px rgba(16,185,129,0.15)); }
    .preview-card-image:hover .icon { transform: scale(1.12) translateY(-2px); filter: drop-shadow(0 0 16px rgba(16,185,129,0.3)); }
    .preview-card-body { padding: var(--space-5); position: relative; }
    .preview-card-body::before { content: ""; position: absolute; top: 0; left: var(--space-5); right: var(--space-5); height: 1px; background: linear-gradient(90deg, transparent, var(--border), transparent); }
    .preview-card-name { font-size: var(--text-lg); font-weight: 600; color: var(--text-primary); margin-bottom: var(--space-1); min-height: 1.5em; }
    .preview-card-name.empty { color: var(--text-tertiary); font-weight: 400; font-style: italic; }
    .preview-card-desc { font-size: var(--text-sm); color: var(--text-secondary); margin-bottom: var(--space-4); min-height: 1.5em; }
    .preview-card-desc.empty { color: var(--text-tertiary); }
    .preview-card-meta { display: flex; align-items: center; justify-content: space-between; padding-top: var(--space-4); }
    .preview-card-price { font-size: var(--text-xl); font-weight: 700; color: var(--primary-600); letter-spacing: -0.02em; }
    .preview-card-stock { font-size: var(--text-sm); color: var(--text-secondary); font-weight: 500; display: inline-flex; align-items: center; gap: var(--space-1); }
    .preview-card-stock::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--success); display: inline-block; animation: pulse 2s ease-in-out infinite; }
    .preview-label { font-size: var(--text-xs); font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: var(--space-3); display: flex; align-items: center; gap: var(--space-2); }
    .preview-label::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }

    .form-footer { display: flex; justify-content: flex-end; gap: var(--space-3); padding: var(--space-6) var(--space-8); border-top: 1px solid var(--border); background: var(--gray-50); }
    .dark .form-footer { background: rgba(30,41,59,0.5); }

    @media (max-width: 768px) {
      .form-layout { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr; }
      .form-card-body { padding: var(--space-5); }
      .form-card-header { padding: var(--space-5); }
      .form-footer { padding: var(--space-4) var(--space-5); flex-direction: column; }
      .form-footer .btn { width: 100%; }
      .live-preview { position: static; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-brand">
        <img src="logo.png" alt="IMS" />
      </a>
      <div class="navbar-links">
        <a href="index.html" class="navbar-link">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 3l7 4-7 4-7-4 7-4z"/><path d="M19 7v8l-7 4v-8l7-4z"/><path d="M5 7v8l7 4v-8l-7-4z"/></svg>
          <span data-i18n="nav.products">Products</span>
        </a>
        <a href="add-product.html" class="navbar-link active">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span data-i18n="nav.addProduct">Add Product</span>
        </a>
        <a href="sales.html" class="navbar-link">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span data-i18n="nav.sales">Sales</span>
        </a>
        <a href="statistics.html" class="navbar-link">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
          <span data-i18n="nav.statistics">Statistics</span>
        </a>
      </div>
      <div class="navbar-right">
        <button class="theme-toggle" id="langBtn" onclick="toggleLang()" title="Change language" style="font-size:var(--text-xs);font-weight:700;letter-spacing:0.05em">FR</button>
        <button class="theme-toggle" onclick="toggleTheme(); this.innerHTML = getThemeIcon()" title="Toggle theme">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/></svg>
        </button>
        <span class="navbar-user">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span id="welcome">Loading...</span>
        </span>
        <button class="btn btn-ghost btn-sm" onclick="logout()">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span data-i18n="nav.signOut">Sign out</span>
        </button>
      </div>
    </div>
  </nav>

  <div id="toast-container" class="toast-container"></div>

  <div class="container page">
    <div class="form-page">
      <div class="form-card">
        <div class="form-card-header">
          <div class="form-card-header-icon" id="formIcon">
            <svg class="icon icon-lg" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </div>
          <div>
            <h2 id="formTitle"></h2>
            <p id="formSubtitle"></p>
          </div>
        </div>

        <div class="form-card-body">
          <div class="form-layout">
            <div>
              <div class="form-section">
                <div class="form-section-title" data-i18n="addProduct.photoSection">Product Photo</div>
                <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFileSelect(event)" />
                <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
                  <svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                  <div class="upload-zone-text" data-i18n="addProduct.uploadClick">Click to upload an image</div>
                  <div class="upload-zone-hint" data-i18n="addProduct.uploadHint">or drag and drop — PNG, JPG up to 5MB</div>
                </div>
                <div class="upload-preview" id="uploadPreview">
                  <img id="previewImage" src="" alt="Preview" />
                  <button class="upload-preview-remove" onclick="removeImage(event)">
                    <svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                  </button>
                </div>
              </div>

              <div class="form-section">
                <div class="form-section-title" data-i18n="addProduct.basicInfo">Basic Information</div>
                <div class="input-group">
                  <label class="input-label" for="name" data-i18n="addProduct.nameLabel">Product Name</label>
                  <input class="input" type="text" id="name" data-i18n-ph="addProduct.namePh" placeholder="e.g. Wireless Headphones" oninput="updatePreview()" />
                </div>
                <div class="input-group">
                  <label class="input-label" for="description" data-i18n="addProduct.descLabel">Description</label>
                  <textarea class="input textarea" id="description" data-i18n-ph="addProduct.descPh" placeholder="Brief description of the product (optional)" oninput="updatePreview()"></textarea>
                </div>
              </div>

              <div class="form-section">
                <div class="form-section-title" data-i18n="addProduct.pricingSection">Pricing & Stock</div>
                <div class="form-row">
                  <div class="input-group">
                    <label class="input-label" for="price" data-i18n="addProduct.priceLabel">Price ($)</label>
                    <input class="input" type="number" id="price" placeholder="0.00" step="0.01" min="0" oninput="updatePreview()" />
                  </div>
                  <div class="input-group">
                    <label class="input-label" for="quantity" data-i18n="addProduct.qtyLabel">Quantity</label>
                    <input class="input" type="number" id="quantity" placeholder="0" min="0" oninput="updatePreview()" />
                  </div>
                </div>
              </div>
            </div>

            <div class="live-preview">
              <div class="preview-label" data-i18n="addProduct.previewLabel">Live Preview</div>
              <div class="preview-card">
                <div class="preview-card-image" id="previewCardImage">
                  <svg class="icon" viewBox="0 0 24 24" style="width:52px;height:52px"><path d="M12 3l7 4-7 4-7-4 7-4z"/><path d="M19 7v8l-7 4v-8l7-4z"/><path d="M5 7v8l7 4v-8l-7-4z"/></svg>
                </div>
                <div class="preview-card-body">
                  <div class="preview-card-name empty" id="previewCardName">Product name</div>
                  <div class="preview-card-desc empty" id="previewCardDesc">Description will appear here</div>
                  <div class="preview-card-meta">
                    <span class="preview-card-price" id="previewCardPrice">$0.00</span>
                    <span class="preview-card-stock" id="previewCardStock">0 in stock</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="form-footer">
          <button class="btn btn-secondary" onclick="window.location.href='index.html'" data-i18n="addProduct.cancel">Cancel</button>
          <button class="btn btn-primary btn-lg" id="saveBtn" onclick="handleSave()">
            <svg class="icon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            <span id="saveBtnText" data-i18n="addProduct.save">Save Product</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    requireAuth();
    initTheme();
    document.querySelector(".theme-toggle").innerHTML = getThemeIcon();
    document.getElementById("welcome").textContent = getWelcomeName();

    const params = new URLSearchParams(window.location.search);
    const productId = params.get("id");
    let uploadedImageUrl = null;
    let newFileSelected = false;

    function applyFormMode() {
      const ap = TRANSLATIONS[getLang()].addProduct;
      if (productId) {
        document.getElementById("formTitle").textContent = ap.editTitle;
        document.getElementById("formSubtitle").textContent = ap.editSubtitle;
        document.getElementById("formIcon").innerHTML = '<svg class="icon icon-lg" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';
        document.getElementById("saveBtnText").textContent = ap.update;
      } else {
        document.getElementById("formTitle").textContent = ap.addTitle;
        document.getElementById("formSubtitle").textContent = ap.addSubtitle;
        document.getElementById("saveBtnText").textContent = ap.save;
      }
    }

    window.onLangChange = function() { applyFormMode(); updatePreview(); };
    initLang();
    applyFormMode();

    if (productId) {
      loadProduct(productId);
    }

    async function loadProduct(id) {
      try {
        const res = await fetch(API + "/products/" + id, { headers: authHeaders() });
        const p = await res.json();
        document.getElementById("name").value = p.name;
        document.getElementById("description").value = p.description || "";
        document.getElementById("quantity").value = p.quantity;
        document.getElementById("price").value = p.price;
        if (p.image) { uploadedImageUrl = p.image; showUploadedPreview(API + p.image); }
        updatePreview();
      } catch { showToast(TRANSLATIONS[getLang()].addProduct.errorLoad, "error"); }
    }

    const uploadZone = document.getElementById("uploadZone");
    uploadZone.addEventListener("dragover", (e) => { e.preventDefault(); uploadZone.classList.add("dragover"); });
    uploadZone.addEventListener("dragleave", () => { uploadZone.classList.remove("dragover"); });
    uploadZone.addEventListener("drop", (e) => {
      e.preventDefault(); uploadZone.classList.remove("dragover");
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        const file = files[0];
        file.type.startsWith("image/") ? handleFile(file) : showToast(TRANSLATIONS[getLang()].addProduct.errorImage, "error");
      }
    });

    function handleFileSelect(e) { const file = e.target.files[0]; if (file) handleFile(file); }

    function handleFile(file) {
      if (file.size > 5 * 1024 * 1024) { showToast(TRANSLATIONS[getLang()].addProduct.errorSize, "error"); return; }
      newFileSelected = true;
      const reader = new FileReader();
      reader.onload = (e) => { showUploadedPreview(e.target.result); updatePreview(); };
      reader.readAsDataURL(file);
    }

    function showUploadedPreview(src) {
      document.getElementById("uploadPreview").style.display = "block";
      document.getElementById("uploadZone").style.display = "none";
      document.getElementById("previewImage").src = src;
      const cardImage = document.getElementById("previewCardImage");
      cardImage.innerHTML = '<img src="' + src + '" alt="Preview" />';
    }

    function removeImage(e) {
      e.stopPropagation();
      document.getElementById("uploadPreview").style.display = "none";
      document.getElementById("uploadZone").style.display = "block";
      document.getElementById("fileInput").value = "";
      newFileSelected = false;
      uploadedImageUrl = null;
      document.getElementById("previewCardImage").innerHTML = '<svg class="icon" viewBox="0 0 24 24" style="width:52px;height:52px"><path d="M12 3l7 4-7 4-7-4 7-4z"/><path d="M19 7v8l-7 4v-8l7-4z"/><path d="M5 7v8l7 4v-8l-7-4z"/></svg>';
      updatePreview();
    }

    function updatePreview() {
      const name = document.getElementById("name").value.trim();
      const desc = document.getElementById("description").value.trim();
      const price = document.getElementById("price").value;
      const qty = document.getElementById("quantity").value;

      const nameEl = document.getElementById("previewCardName");
      const descEl = document.getElementById("previewCardDesc");
      const priceEl = document.getElementById("previewCardPrice");
      const stockEl = document.getElementById("previewCardStock");

      const ap = TRANSLATIONS[getLang()].addProduct;
      if (name) { nameEl.textContent = name; nameEl.classList.remove("empty"); }
      else { nameEl.textContent = ap.previewName; nameEl.classList.add("empty"); }

      if (desc) { descEl.textContent = desc; descEl.classList.remove("empty"); }
      else { descEl.textContent = ap.previewDesc; descEl.classList.add("empty"); }

      priceEl.textContent = price && parseFloat(price) > 0 ? "$" + parseFloat(price).toFixed(2) : "$0.00";
      stockEl.textContent = (qty ? parseInt(qty) : 0) + " " + ap.inStock;
    }

    async function handleSave() {
      const name = document.getElementById("name").value.trim();
      const description = document.getElementById("description").value.trim();
      const quantity = parseInt(document.getElementById("quantity").value) || 0;
      const price = parseFloat(document.getElementById("price").value) || 0;
      const btn = document.getElementById("saveBtn");

      const ap = TRANSLATIONS[getLang()].addProduct;
      if (!name) { showToast(ap.errorName, "error"); document.getElementById("name").focus(); return; }
      if (price <= 0) { showToast(ap.errorPrice, "error"); document.getElementById("price").focus(); return; }

      btn.disabled = true;
      document.getElementById("saveBtnText").textContent = productId ? ap.updating : ap.saving;
      var redirected = false;

      try {
        if (newFileSelected && document.getElementById("fileInput").files.length > 0) {
          const formData = new FormData();
          formData.append("file", document.getElementById("fileInput").files[0]);
          const uploadRes = await fetch(API + "/products/upload-image", {
            method: "POST", headers: { Authorization: "Bearer " + getToken() }, body: formData,
          });
          uploadedImageUrl = (await uploadRes.json()).image_url;
        }

        const body = { name, description: description || null, quantity, price, image: uploadedImageUrl };
        const url = productId ? API + "/products/" + productId : API + "/products";
        const method = productId ? "PUT" : "POST";
        const res = await fetch(url, { method, headers: authHeaders(), body: JSON.stringify(body) });

        if (res.ok) {
          redirected = true;
          document.getElementById("saveBtnText").textContent = ap.redirecting;
          await new Promise(r => setTimeout(r, 300));
          window.location.href = "index.html";
        } else {
          const err = await res.json().catch(() => ({}));
          showToast(err.detail || ap.errorSave, "error");
        }
      } catch { showToast(ap.errorConn, "error"); }
      finally { if (!redirected) { btn.disabled = false; document.getElementById("saveBtnText").textContent = productId ? ap.update : ap.save; } }
    }

    document.addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); handleSave(); } });
  </script>
</body>
</html>
